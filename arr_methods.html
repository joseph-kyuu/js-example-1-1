<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

    <input class="chargingName" type="text" placeholder="充電站名稱" />

      <option value="投幣式">投幣式</option>
    </select>
    <input class="chargingStorage" type="button" value="儲存" />

    <input class="showAllBtn" type="button" value="全部" />
    <input class="showFreeBtn" type="button" value="免費" />
    <input class="showCoinBtn" type="button" value="投幣式" />
    <ul class="showcharging"></ul>
    <h2>刪除資料</h2>
    <input class="deleteOneBtn" type="button" value="刪除最後一筆資料" />
    <script src="./javascript/arr_methods.js"></script>
